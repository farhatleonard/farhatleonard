# Configuration Netlify : lue automatiquement quand le site est relié au dépôt GitHub.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers du site (JS, CSS, polices) : mis en cache longtemps, leur nom change à chaque modification.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # PHASE DE TEST : empêche Google d'indexer le site tant qu'il n'est pas terminé.
    # À SUPPRIMER le jour du lancement officiel.
    X-Robots-Tag = "noindex"
